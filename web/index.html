<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>voice-patch · 视频口误修复</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0f1115; --panel:#181b22; --line:#2a2f3a; --fg:#e6e9ef; --dim:#8b93a5; --acc:#4f8cff; --ok:#3fb96f; --warn:#e2a33c; --err:#e05c5c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.6 "Segoe UI",system-ui,sans-serif; }
  header { padding:14px 22px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; }
  header h1 { font-size:16px; margin:0; }
  .warn-pill { color:var(--warn); font-size:12px; }
  main { max-width:960px; margin:0 auto; padding:20px 22px 80px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:16px; }
  .card h2 { font-size:13px; margin:0 0 12px; color:var(--dim); font-weight:600; letter-spacing:.05em; }
  button { background:var(--acc); border:0; color:#fff; padding:7px 16px; border-radius:7px; cursor:pointer; font-size:13px; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--fg); }
  input[type=text], textarea { width:100%; background:#0c0e12; color:var(--fg); border:1px solid var(--line); border-radius:7px; padding:8px 10px; font-size:14px; }
  textarea { min-height:56px; resize:vertical; }
  label.switch { display:inline-flex; gap:6px; align-items:center; color:var(--dim); font-size:13px; margin-right:14px; cursor:pointer; }
  input[type=range] { vertical-align:middle; }
  #wave { border:1px solid var(--line); border-radius:8px; overflow:hidden; margin:10px 0; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:8px 0; }
  .meta { color:var(--dim); font-size:12px; }
  .take { display:flex; gap:10px; align-items:center; padding:8px 10px; border:1px solid var(--line); border-radius:8px; margin:6px 0; }
  .take.ok { border-color:var(--ok); }
  .take.bad { border-color:var(--err); }
  .take .info { flex:1; }
  .banner { border-radius:8px; padding:10px 14px; margin:8px 0; font-size:13px; }
  .banner.warn { background:#3a2c14; color:var(--warn); }
  .banner.err { background:#3a1616; color:var(--err); }
  video { width:100%; border-radius:8px; margin-top:8px; background:#000; }
  a.dl { color:var(--acc); }
  .hint { color:var(--dim); font-size:12px; }
  #speed-val { min-width:52px; display:inline-block; }
</style>
</head>
<body>
<header><h1>voice-patch · 视频口误修复</h1><span id="health" class="warn-pill"></span></header>
<main>
  <div class="card" id="card-upload">
    <h2>1 · 上传视频</h2>
    <div class="row">
      <input type="file" id="file" accept="video/*">
      <button id="btn-upload">上传并抽轨</button>
      <span class="meta" id="proj-meta"></span>
    </div>
  </div>

  <div class="card" id="card-select" style="display:none">
    <h2>2 · 在波形上框选可疑区间，然后转写</h2>
    <div id="wave"></div>
    <div class="row">
      <button id="btn-transcribe">转写该区间（自动扩展到词边界）</button>
      <button class="ghost" id="btn-demo-range" title="无需拖拽，快速体验用">填入示例区间 2.0–3.2s</button>
      <span class="meta" id="region-meta">拖拽创建选区</span>
    </div>
  </div>

  <div class="card" id="card-edit" style="display:none">
    <h2>3 · 修改文本（送合成前会自动做数字→中文读法规整）</h2>
    <div id="asr-hint" class="banner warn" style="display:none"></div>
    <div class="row meta" id="seg-meta"></div>
    <textarea id="text"></textarea>
    <div class="row">
      <label class="switch">语速
        <input type="range" id="speed" min="0.90" max="1.10" step="0.01" value="1.00">
        <span id="speed-val">自动</span>
      </label>
      <label class="switch"><input type="checkbox" id="auto-speed" checked> 自动求最优语速</label>
      <label class="switch"><input type="checkbox" id="stretch"> 允许 5% 内变速（勾选后启用）</label>
      <label class="switch">候选数 <input type="number" id="takes" value="3" min="1" max="5" style="width:44px"></label>
      <button id="btn-synth">生成候选（TTS 多 take）</button>
      <span class="meta" id="est"></span>
    </div>
    <div id="synth-banner"></div>
  </div>

  <div class="card" id="card-takes" style="display:none">
    <h2>4 · 试听候选并择优，然后渲染导出</h2>
    <div id="takes"></div>
    <div class="row"><button id="btn-render" disabled>用选中 take 渲染成片</button><span class="meta" id="render-meta"></span></div>
  </div>

  <div class="card" id="card-out" style="display:none">
    <h2>5 · A/B 对比与导出</h2>
    <div class="row">
      <button class="ghost" id="ab-orig">播放原声区间</button>
      <button class="ghost" id="ab-new">播放修复后区间</button>
      <a id="dl" class="dl" download>下载成片</a>
    </div>
    <video id="video" controls></video>
  </div>
</main>

<script type="module">
import WaveSurfer from 'https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.esm.js';
import RegionsPlugin from 'https://unpkg.com/wavesurfer.js@7/dist/plugins/regions.esm.js';

const $ = id => document.getElementById(id);
let ws = null, regions = null, projectId = null, segmentId = null;
let audioUrl = null, currentTakes = [], selectedTake = null, segInfo = null;

fetch('/api/health').then(r=>r.json()).then(h=>{
  if (h.warnings?.length) $('health').textContent = h.warnings.join('；');
});

$('btn-upload').onclick = async () => {
  const f = $('file').files[0];
  if (!f) return alert('请选择视频文件');
  $('btn-upload').disabled = true;
  const fd = new FormData(); fd.append('file', f);
  const r = await (await fetch('/api/projects', {method:'POST', body:fd})).json();
  $('btn-upload').disabled = false;
  if (r.detail) return alert('上传失败: ' + r.detail);
  projectId = r.id;
  $('proj-meta').textContent = `项目 ${r.id} · 时长 ${r.duration.toFixed(1)}s`;
  $('card-select').style.display = '';
  loadWave(`/api/projects/${r.id}/audio.wav`);
};

function loadWave(url) {
  audioUrl = url;
  ws?.destroy();
  ws = WaveSurfer.create({container:'#wave', waveColor:'#5a6274', progressColor:'#4f8cff', height:110, url});
  regions = ws.registerPlugin(RegionsPlugin.create());
  regions.on('region-created', () => {           // 只保留一个选区
    const rs = regions.getRegions();
    if (rs.length > 1) rs[0].remove();
    updateRegionMeta();
  });
  regions.enableDragSelection({});
  ws.on('interaction', () => ws.playPause());
}

function activeRegion() { return regions?.getRegions()[0]; }
$('btn-demo-range').onclick = () => {
  regions?.clearRegions();
  regions.addRegion({start: 2.0, end: 3.2, color: 'rgba(79,140,255,0.25)', drag: true, resize: true});
  updateRegionMeta();
};
function updateRegionMeta() {
  const r = activeRegion();
  $('region-meta').textContent = r
    ? `区间 ${r.start.toFixed(2)}s → ${r.end.toFixed(2)}s（${(r.end-r.start).toFixed(2)}s）`
    : '拖拽创建选区';
}

$('btn-transcribe').onclick = async () => {
  const r = activeRegion();
  if (!r) return alert('请先在波形上框选区间');
  $('btn-transcribe').disabled = true;
  const res = await (await fetch(`/api/projects/${projectId}/transcribe`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({t0:r.start, t1:r.end})
  })).json();
  $('btn-transcribe').disabled = false;
  if (res.detail) return alert('转写失败: ' + res.detail);
  segmentId = res.segment_id; segInfo = res;
  $('card-edit').style.display = '';
  $('seg-meta').textContent =
    `扩展后重录区间 [${res.T0.toFixed(2)}, ${res.T1.toFixed(2)}] · 窗口 ${res.window.toFixed(2)}s`;
  $('text').value = res.text_norm || '';
  if (res.asr_hint) { $('asr-hint').style.display=''; $('asr-hint').textContent = res.asr_hint; }
  $('card-takes').style.display = 'none'; $('card-out').style.display = 'none';
  $('synth-banner').innerHTML = '';
  updateEst();
};

$('text').oninput = updateEst;
function updateEst() {
  const t = $('text').value.trim();
  $('est').textContent = t ? `预计时长 ≈ ${(t.length/4.5).toFixed(2)}s（粗估）` : '';
}
$('auto-speed').onchange = () => { $('speed').disabled = $('auto-speed').checked; $('speed-val').textContent = $('auto-speed').checked ? '自动' : $('speed').value; };
$('speed').oninput = () => $('speed-val').textContent = $('speed').value;

$('btn-synth').onclick = async () => {
  const text = $('text').value.trim();
  if (!text) return alert('文本为空');
  $('btn-synth').disabled = true;
  const res = await (await fetch(`/api/segments/${segmentId}/synthesize`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      text,
      speed: $('auto-speed').checked ? null : parseFloat($('speed').value),
      allow_stretch: $('stretch').checked,
      takes: parseInt($('takes').value)
    })
  })).json();
  $('btn-synth').disabled = false;
  if (res.detail) return alert('合成失败: ' + res.detail);
  currentTakes = res.takes; selectedTake = null; $('btn-render').disabled = true;
  $('card-takes').style.display = '';
  $('speed').value = res.speed; $('speed-val').textContent = res.speed;
  let banner = `窗口 ${res.window}s · 语速 ${res.speed}×`;
  if (res.d_class) banner = `<div class="banner err">Δ 超过窗口一半（${res.delta>0?'+':''}${res.delta}s）——属于「重度膨胀」D 类：等长替换装不下。建议路线：① 口语化压缩文本（如 1999.99 → "两千块"）② 扩大框选区间整句重录 ③ 人工补录 ④ 保留字幕标注。当前候选均为溢出，仅供试听。</div>` + banner;
  else if (res.overflow) banner = `<div class="banner warn">候选仍略超窗口（${res.delta>0?'+':''}${res.delta}s）。可勾选「允许 5% 内变速」、调语速滑块，或扩大选区多吃一点停顿。</div>` + banner;
  $('synth-banner').innerHTML = banner;
  renderTakes();
};

function renderTakes() {
  $('takes').innerHTML = '';
  currentTakes.forEach((t, i) => {
    const div = document.createElement('div');
    div.className = 'take ' + (t.status==='ok' ? 'ok' : 'bad');
    div.innerHTML = `<div class="info"><b>take ${t.take_no}</b> · 时长 ${t.final_dur}s
      （原始 ${t.raw_dur}s · ${t.speed}×${t.stretch!=1?` · 拉伸 ${t.stretch}×`:''}）
      · Δ ${t.delta>0?'+':''}${t.delta}s ${t.status==='ok'?'✓':'溢出'}</div>`;
    const play = document.createElement('button'); play.textContent = '▶ 试听'; play.className='ghost';
    play.onclick = () => new Audio(t.wav).play();
    const pick = document.createElement('button'); pick.textContent = '选用';
    pick.onclick = () => { selectedTake = t; $('btn-render').disabled = false;
      [...$('takes').children].forEach(c=>c.style.outline='');
      div.style.outline = '2px solid var(--acc)'; };
    div.append(play, pick);
    $('takes').append(div);
  });
}

$('btn-render').onclick = async () => {
  if (!selectedTake) return;
  $('btn-render').disabled = true;
  const res = await (await fetch(`/api/segments/${segmentId}/render`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({take_id: selectedTake.take_id})
  })).json();
  $('btn-render').disabled = false;
  if (res.detail) return alert('渲染失败: ' + res.detail);
  $('card-out').style.display = '';
  $('video').src = res.video;
  $('dl').href = res.video;
  $('render-meta').textContent = `完成 · 最终时长 ${res.final_dur}s · Δ ${res.delta}s`;
  $('ab-orig').onclick = () => { ws.setTime(segInfo.T0); ws.play(); setTimeout(()=>ws.pause(), (segInfo.T1-segInfo.T0)*1000); };
  $('ab-new').onclick = () => { new Audio(selectedTake.wav).play(); };
};
</script>
</body>
</html>
