# 口误修复平台配置
# provider 可选：mock（无 Key 也可跑通全链路）/ volc（火山引擎）/ deepseek（仅 ASR）

asr:
  provider: deepseek        # deepseek | volc | mock（deepseek：同步整段文本，无字级时间戳）
  fallback: mock

tts:
  provider: volc            # volc | mock（已实测接通 seed-audio-1.0）
  fallback: mock
  takes: 3                  # 每次 /synthesize 生成的候选数量

deepseek:
  base_url: https://api.deepseek.com/v1/tools/asr   # 同步上传，≤120s / ≤8MiB
  api_key: ""               # 也可用环境变量 DEEPSEEK_API_KEY

volc:
  api_key: ""               # 新版控制台 API Key（推荐，X-Api-Key 单头鉴权，无需 app_id）；也可用环境变量 VOLC_API_KEY
  appid: ""                 # 旧版控制台才需要；环境变量 VOLC_APP_ID
  access_token: ""          # 旧版控制台才需要；环境变量 VOLC_ACCESS_TOKEN
  asr_cluster: ""           # 录音文件识别 cluster（以官网为准）
  voice_type: ""            # 可选：指定音色 ID（豆包 2.0 音色或复刻音色）；留空则用参考音频克隆

render:
  target_lufs: -16          # 语音类目标响度（EBU R128）
  true_peak: -1.5
  crossfade_ms: 20          # 拼接等功率交叉淡化
  noise_bed_gain: 0.06      # 底噪垫床权重
  speed_range: [0.95, 1.10] # 自动语速边界（下限保守，避免放慢到拖沓）
  tolerance_abs: 0.150      # 时长偏差容忍：绝对值
  tolerance_rel: 0.08       # 或相对值（取宽）

storage:
  data_dir: data
